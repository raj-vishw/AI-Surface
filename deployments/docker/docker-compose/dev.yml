services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-airecon_dev}
    ports:
      - "5432:5432"
    volumes:
      - airecon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airecon} -d ${POSTGRES_DB:-airecon_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile.server
    ports:
      - "${AI_RECON_SERVER_PORT:-8080}:8080"
    environment:
      AI_RECON_APP_ENV: development
      AI_RECON_SERVER_HOST: 0.0.0.0
      AI_RECON_SERVER_PORT: 8080
      AI_RECON_DATABASE_HOST: postgres
      AI_RECON_DATABASE_PORT: 5432
      AI_RECON_DATABASE_USER: ${POSTGRES_USER:-airecon}
      AI_RECON_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      AI_RECON_DATABASE_NAME: ${POSTGRES_DB:-airecon_dev}
      AI_RECON_REDIS_ADDRESS: redis:6379
      AI_RECON_LOG_LEVEL: ${AI_RECON_LOG_LEVEL:-debug}
      AI_RECON_LOG_FORMAT: ${AI_RECON_LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  airecon_postgres_data:
