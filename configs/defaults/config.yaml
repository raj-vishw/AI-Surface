# Baseline configuration shared by every environment. Values here are
# overlaid onto the built-in Go defaults (internal/config.defaultConfig)
# and are themselves overlaid by configs/<environment>/config.yaml, then by
# AI_RECON_* environment variables, then by CLI flags where applicable.
#
# Do not put secrets in this file — see .env.example / environment
# variables for anything sensitive (database password, redis password).

application:
  name: ai-recon-platform

server:
  host: "0.0.0.0"
  port: 8080
  read_header_timeout: 5s
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  shutdown_timeout: 15s

database:
  port: 5432
  ssl_mode: disable
  connect_timeout: 5s
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_lifetime: 30m
  connection_max_idle_time: 5m

redis:
  database: 0
  connect_timeout: 5s

http_client:
  timeout: 10s
  max_idle_connections: 100
  max_connections_per_host: 20
  max_response_size: 10485760
  max_redirects: 5

discovery:
  http:
    enabled: true
    timeout: 10s
    max_concurrency: 10
    max_response_size: 10485760
    follow_redirects: true
    max_redirects: 5
    methods:
      - GET
    schemes:
      - https
      - http
    detect_ai_endpoints: true
    paths:
      - /
      - /robots.txt
      - /openapi.json
      - /swagger.json
      - /api
      - /api/
      - /v1
      - /v1/
      - /v1/models
      - /v1/chat/completions
      - /v1/completions
      - /v1/embeddings
      - /models
      - /health
      - /healthz
      - /ready
      - /status
    profiles:
      quick:
        paths:
          - /
          - /robots.txt
          - /openapi.json
          - /v1/models
          - /health
      comprehensive:
        paths:
          - /
          - /robots.txt
          - /openapi.json
          - /swagger.json
          - /api
          - /api/
          - /v1
          - /v1/
          - /v1/models
          - /v1/chat/completions
          - /v1/completions
          - /v1/embeddings
          - /models
          - /health
          - /healthz
          - /ready
          - /status

  network:
    enabled: true
    connect_timeout: 2s
    max_concurrency: 100
    max_hosts: 256
    requests_per_second: 0
    http_candidate_ports: [80, 443, 8000, 8080, 8443]
    ai_candidate_ports: [11434, 5000, 8000, 8080, 8888]
    profiles:
      quick:
        ports: [80, 443, 8000, 8080, 8443, 8888, 11434]
      standard:
        ports: [22, 80, 443, 3000, 5000, 8000, 8080, 8443, 8888, 9000, 11434]
      comprehensive:
        ports:
          [
            21, 22, 23, 25, 53, 80, 110, 143, 443, 993, 995,
            1433, 1521, 3000, 3306, 3389, 5000, 5432, 5900, 6379,
            8000, 8008, 8080, 8081, 8088, 8443, 8888, 9000, 9090,
            9200, 9300, 11211, 11434, 27017, 50000,
          ]

  dns:
    enabled: true
    timeout: 3s
    max_concurrency: 20
    resolvers: []
    record_types: [A, AAAA, CNAME, MX, NS, TXT, SOA, CAA]
    reverse_ptr: true
    requests_per_second: 0
    subdomains:
      enabled: true
      max_candidates: 10000
      wordlist: ""
      words: [api, app, dev, staging, test, admin, portal, chat, model, models, inference, llm, ai, ml]
      wildcard_detection: true
      max_depth: 1 # conservative base default; profiles/--max-depth opt into deeper enumeration explicitly
    profiles:
      quick:
        record_types: [A, AAAA, CNAME, NS, MX, SOA]
        subdomain_words: [api, www, app, dev, admin]
        max_depth: 1
      standard:
        record_types: [A, AAAA, CNAME, MX, NS, TXT, SOA, CAA]
        subdomain_words:
          [
            api, www, app, dev, staging, test, admin, portal, chat, model,
            models, inference, llm, ai, ml, mail, ftp, vpn, secure, beta,
          ]
        max_depth: 1
      comprehensive:
        record_types: [A, AAAA, CNAME, MX, NS, TXT, SOA, CAA]
        subdomain_words:
          [
            api, www, app, dev, staging, test, admin, portal, chat, model,
            models, inference, llm, ai, ml, mail, ftp, vpn, secure, beta,
            auth, gateway, internal, private, backend, service, static, cdn,
            assets, docs, status, monitor, grafana, prometheus, jenkins,
            gitlab, git, ci, cd, k8s, kube, docker, registry, npm, pypi,
            old, legacy, sandbox, demo, qa,
          ]
        max_depth: 2

  endpoint:
    enabled: true
    timeout: 10s
    max_concurrency: 10
    requests_per_second: 0
    max_response_size: 2097152 # 2 MiB
    max_depth: 2
    max_pages: 100
    max_endpoints: 1000
    follow_redirects: true
    max_redirects: 5
    enable_robots: true
    enable_sitemap: true
    enable_javascript: true
    enable_openapi: true
    max_sitemaps: 10
    max_sitemap_urls: 1000
    seed_paths:
      - /
    sensitive_parameters:
      - token
      - access_token
      - refresh_token
      - api_key
      - apikey
      - key
      - password
      - passwd
      - secret
      - signature
      - session
      - code
      - authorization
    profiles:
      quick:
        max_depth: 1
        max_pages: 20
        max_endpoints: 200
        enable_robots: false
        enable_sitemap: false
        enable_javascript: false
        enable_openapi: true
      standard:
        max_depth: 2
        max_pages: 100
        max_endpoints: 1000
        enable_robots: true
        enable_sitemap: true
        enable_javascript: true
        enable_openapi: true
      comprehensive:
        max_depth: 3
        max_pages: 500
        max_endpoints: 5000
        enable_robots: true
        enable_sitemap: true
        enable_javascript: true
        enable_openapi: true

fingerprint:
  enabled: true
  signatures_path: "" # empty = use the built-in signature set (internal/fingerprint.DefaultSignaturesFS)
  min_confidence: 0.30 # matches the "low" confidence-level boundary — weaker matches aren't worth reporting
  confidence_change_threshold: 0.10
  thresholds: {} # empty = internal/fingerprint.DefaultThresholds (weak/low/medium/high/very_high at 0/0.30/0.60/0.80/0.95)
  historical_tracking: true
  detect_changes: true
  redact_sensitive_data: true

logging:
  level: info
  format: json

security:
  require_authorization: true
  dry_run: false
