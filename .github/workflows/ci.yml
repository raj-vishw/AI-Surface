name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Test (race detector)
        run: make test-race

      - name: Build all executables
        run: make build-all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  # phase15.md §6/§63/§67/§102/§103: dependency (incl. stdlib) vulnerability
  # scanning, secret scanning, and container image scanning. Each step
  # fails the job (and therefore the required check) on a real finding —
  # see .gitleaks.toml for the one narrow, documented allowlist (this
  # repository's own redaction-engine test fixtures, which are
  # intentionally secret-shaped).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Dependency vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_NO_GIT: "true"

      - name: Build server image for scanning
        run: |
          docker build -f deployments/docker/Dockerfile.server -t ai-recon-server:ci .

      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ai-recon-server:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
