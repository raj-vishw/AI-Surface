name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Test (race detector)
        run: make test-race

      - name: Build all executables
        run: make build-all

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  # phase15.md §6/§63/§67/§102/§103: dependency (incl. stdlib) vulnerability
  # scanning, secret scanning, and container image scanning. Each step
  # fails the job (and therefore the required check) on a real finding —
  # see .gitleaks.toml for the one narrow, documented allowlist (this
  # repository's own redaction-engine test fixtures, which are
  # intentionally secret-shaped).
  #
  # Every tool here is installed directly (go install / each project's own
  # official install script) rather than via a third-party marketplace
  # Action — this avoids that Action's own version-pin/licensing/token
  # requirements becoming a second thing that can break independently of
  # the actual scan, and it's exactly what was verified locally before
  # this workflow was written (see docs/security/final-audit.md).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Dependency vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --no-git --config .gitleaks.toml

      - name: Build server image for scanning
        run: docker build -f deployments/docker/Dockerfile.server -t ai-recon-server:ci .

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Container image scan (Trivy)
        run: trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed ai-recon-server:ci
